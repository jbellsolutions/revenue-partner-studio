[program:hermes-studio]
command=/opt/hermes-orgo-studio/studio-serve
directory=/opt/hermes-orgo-studio
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/hermes-studio.log
stderr_logfile=/var/log/hermes-studio-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
