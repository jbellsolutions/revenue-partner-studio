[program:orgo-maintenance]
command=/usr/local/sbin/orgo-maintenance-loop
directory=/root
user=root
environment=HERMES_HOME="/root/.hermes",HOME="/root"
autostart=true
autorestart=true
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/orgo/orgo-maintenance-supervisor.log
stderr_logfile=/var/log/orgo/orgo-maintenance-supervisor.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
